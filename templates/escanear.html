<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Boletos QR</title>
    <!-- Librería del escáner de cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border-radius: 10px; overflow: hidden; }
        #resultado { margin-top: 20px; font-size: 1.2rem; font-weight: bold; padding: 15px; border-radius: 8px; display: none; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <h2>🎟️ Control de Acceso Evento</h2>
    <div id="reader"></div>
    <div id="resultado"></div>

    <script>
        let escaneando = true;

        function onScanSuccess(decodedText) {
            if (!escaneando) return;
            escaneando = false; // Pausar escaneo para procesar

            fetch('/api/validar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo: decodedText })
            })
            .then(res => res.json())
            .then(data => {
                const resDiv = document.getElementById('resultado');
                resDiv.style.display = 'block';
                resDiv.className = data.status;
                resDiv.innerText = data.mensaje;

                // Reanudar cámara en 3 segundos
                setTimeout(() => {
                    resDiv.style.display = 'none';
                    escaneando = true;
                }, 3000);
            });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
